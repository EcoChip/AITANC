<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Super Toolbox — 100+ Utilidades</title>
<!-- Font Awesome para iconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============================================================
   RESET & VARIABLES
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f1a;
  --surface:#1a1a2e;
  --card:#16213e;
  --card-hover:#1a1a40;
  --accent:#e94560;
  --accent2:#0f3460;
  --text:#eee;
  --text-muted:#999;
  --radius:14px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --transition:.25s ease;
}
html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.6;
}

/* ============================================================
   HEADER
   ============================================================ */
header{
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  padding:2.5rem 1rem 2rem;
  text-align:center;
  position:sticky;top:0;z-index:100;
  box-shadow:0 4px 30px rgba(233,69,96,.3);
}
header h1{font-size:clamp(1.6rem,5vw,2.8rem);font-weight:800;letter-spacing:-.5px;margin-bottom:.3rem}
header h1 span{color:#ffdd57}
header p.subtitle{font-size:.95rem;opacity:.85;margin-bottom:1.2rem}

/* Search bar */
.search-wrap{
  max-width:560px;margin:0 auto;position:relative;
}
.search-wrap i{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);font-size:1.1rem;
}
#searchInput{
  width:100%;padding:.85rem 1rem .85rem 2.8rem;
  border:2px solid rgba(255,255,255,.15);border-radius:50px;
  background:rgba(0,0,0,.35);color:#fff;font-size:1rem;
  outline:none;transition:var(--transition);
}
#searchInput:focus{border-color:var(--accent);background:rgba(0,0,0,.55)}
#searchInput::placeholder{color:rgba(255,255,255,.45)}

/* Counter badge */
.counter{
  display:inline-block;margin-top:.75rem;
  background:rgba(0,0,0,.3);padding:.3rem 1rem;border-radius:50px;
  font-size:.85rem;color:rgba(255,255,255,.8);
}

/* ============================================================
   GRID
   ============================================================ */
main{max-width:1400px;margin:2rem auto;padding:0 1rem}
#grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:1rem;
}
.card{
  background:var(--card);border-radius:var(--radius);
  padding:1.4rem 1.1rem;cursor:pointer;
  transition:transform var(--transition),box-shadow var(--transition),background var(--transition);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  border:1px solid rgba(255,255,255,.04);
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow);
  background:var(--card-hover);
  border-color:rgba(233,69,96,.25);
}
.card .icon{font-size:2.2rem;margin-bottom:.6rem}
.card h3{font-size:.95rem;font-weight:700;margin-bottom:.3rem}
.card p{font-size:.78rem;color:var(--text-muted);line-height:1.4}

/* No results */
#noResults{
  display:none;text-align:center;padding:4rem 1rem;
  color:var(--text-muted);font-size:1.1rem;
}
#noResults i{font-size:3rem;display:block;margin-bottom:1rem;color:var(--accent)}

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:1rem;
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--surface);border-radius:var(--radius);
  width:100%;max-width:620px;max-height:90vh;overflow-y:auto;
  padding:2rem 1.8rem;position:relative;
  box-shadow:0 12px 60px rgba(0,0,0,.6);
  animation:modalIn .3s ease;
}
@keyframes modalIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.modal-close{
  position:absolute;top:12px;right:14px;
  background:none;border:none;color:var(--text-muted);
  font-size:1.5rem;cursor:pointer;transition:color var(--transition);
}
.modal-close:hover{color:var(--accent)}
.modal h2{font-size:1.35rem;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.modal h2 .icon{font-size:1.6rem}

/* Form elements inside modals */
.modal label{display:block;font-size:.85rem;color:var(--text-muted);margin:.7rem 0 .25rem}
.modal input,.modal select,.modal textarea{
  width:100%;padding:.65rem .8rem;border:1px solid rgba(255,255,255,.12);
  border-radius:8px;background:rgba(0,0,0,.3);color:#fff;
  font-size:.95rem;outline:none;transition:border var(--transition);
  font-family:inherit;
}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--accent)}
.modal textarea{resize:vertical;min-height:80px}
.modal button.btn{
  display:inline-block;margin-top:.8rem;
  padding:.6rem 1.4rem;border:none;border-radius:8px;
  background:var(--accent);color:#fff;font-size:.9rem;
  cursor:pointer;font-weight:600;transition:background var(--transition);
}
.modal button.btn:hover{background:#c0392b}
.modal .result-box{
  margin-top:.8rem;padding:.8rem;border-radius:8px;
  background:rgba(0,0,0,.3);font-family:'Courier New',monospace;
  font-size:.9rem;word-break:break-all;min-height:38px;
  border:1px solid rgba(255,255,255,.06);
}
.modal .row{display:flex;gap:.6rem;flex-wrap:wrap}
.modal .row>*{flex:1;min-width:120px}

/* ============================================================
   FOOTER
   ============================================================ */
footer{text-align:center;padding:2rem 1rem;color:var(--text-muted);font-size:.8rem}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:600px){
  header{padding:1.5rem .8rem 1.2rem}
  .modal{padding:1.4rem 1rem}
  #grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
  .card{padding:1rem .8rem}
}

/* Scrollbar */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:4px}
</style>
</head>
<body>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header>
  <h1>⚡ Super <span>Toolbox</span></h1>
  <p class="subtitle">Más de 100 utilidades prácticas al alcance de un clic</p>
  <div class="search-wrap">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Buscar herramienta..." autofocus>
  </div>
  <div class="counter">Mostrando <strong id="visibleCount">0</strong> de <strong id="totalCount">0</strong> herramientas</div>
</header>

<!-- ============================================================
     MAIN GRID
     ============================================================ -->
<main>
  <div id="grid"></div>
  <div id="noResults"><i class="fas fa-ghost"></i>No se encontraron herramientas. Prueba con otra búsqueda.</div>
</main>

<!-- ============================================================
     MODAL OVERLAY
     ============================================================ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <h2 id="modalTitle"><span class="icon"></span><span class="name"></span></h2>
    <div id="modalBody"></div>
  </div>
</div>

<footer>Super Toolbox &copy; 2026 — Hecho con ❤️ y JavaScript</footer>

<script>
/* ============================================================
   TOOLS DATA ARRAY
   Each tool: { name, desc, icon (FA class or emoji), init(container) }
   ============================================================ */
const tools = [

/* -------------------------------------------------------
   1. Calculadora Básica
   ------------------------------------------------------- */
{
  name:"Calculadora Básica",desc:"Suma, resta, multiplica y divide",icon:"fas fa-calculator",
  init(c){
    c.innerHTML=`<input id="calcDisplay" readonly style="font-size:1.6rem;text-align:right;margin-bottom:.6rem">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px" id="calcPad"></div>`;
    const btns=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C'];
    const pad=c.querySelector('#calcPad');const disp=c.querySelector('#calcDisplay');
    btns.forEach(b=>{const btn=document.createElement('button');btn.className='btn';btn.textContent=b;
      btn.style.cssText='padding:.7rem;font-size:1.1rem;border-radius:8px;';
      btn.onclick=()=>{
        if(b==='C')disp.value='';
        else if(b==='='){try{disp.value=Function('"use strict";return('+disp.value+')')()}catch{disp.value='Error'}}
        else disp.value+=b;
      };pad.appendChild(btn)});
  }
},

/* 2 */ {name:"Conversor de Longitud",desc:"Metros, km, millas, pies, pulgadas",icon:"fas fa-ruler",
  init(c){
    const units={m:1,km:1000,mi:1609.344,ft:0.3048,in:0.0254,cm:0.01,mm:0.001,yd:0.9144};
    c.innerHTML=`<div class="row"><div><label>Valor</label><input id="lVal" type="number" value="1"></div>
    <div><label>De</label><select id="lFrom">${Object.keys(units).map(u=>`<option>${u}</option>`).join('')}</select></div>
    <div><label>A</label><select id="lTo">${Object.keys(units).map(u=>`<option ${u==='km'?'selected':''}>${u}</option>`).join('')}</select></div></div>
    <button class="btn" id="lBtn">Convertir</button><div class="result-box" id="lRes"></div>`;
    c.querySelector('#lBtn').onclick=()=>{const v=+c.querySelector('#lVal').value;
      const f=units[c.querySelector('#lFrom').value];const t=units[c.querySelector('#lTo').value];
      c.querySelector('#lRes').textContent=(v*f/t).toFixed(6)};
  }
},

/* 3 */ {name:"Conversor de Peso",desc:"Kg, libras, onzas, gramos, toneladas",icon:"fas fa-weight-hanging",
  init(c){
    const u={kg:1,g:0.001,lb:0.453592,oz:0.0283495,t:1000,mg:0.000001,st:6.35029};
    c.innerHTML=`<div class="row"><div><label>Valor</label><input id="wV" type="number" value="1"></div>
    <div><label>De</label><select id="wF">${Object.keys(u).map(k=>`<option>${k}</option>`).join('')}</select></div>
    <div><label>A</label><select id="wT">${Object.keys(u).map(k=>`<option ${k==='lb'?'selected':''}>${k}</option>`).join('')}</select></div></div>
    <button class="btn" id="wB">Convertir</button><div class="result-box" id="wR"></div>`;
    c.querySelector('#wB').onclick=()=>{const v=+c.querySelector('#wV').value;
      c.querySelector('#wR').textContent=(v*u[c.querySelector('#wF').value]/u[c.querySelector('#wT').value]).toFixed(6)};
  }
},

/* 4 */ {name:"Conversor de Temperatura",desc:"Celsius, Fahrenheit, Kelvin",icon:"fas fa-thermometer-half",
  init(c){
    c.innerHTML=`<div class="row"><div><label>Valor</label><input id="tV" type="number" value="100"></div>
    <div><label>De</label><select id="tF"><option>C</option><option>F</option><option>K</option></select></div>
    <div><label>A</label><select id="tT"><option>F</option><option>C</option><option>K</option></select></div></div>
    <button class="btn" id="tB">Convertir</button><div class="result-box" id="tR"></div>`;
    c.querySelector('#tB').onclick=()=>{let v=+c.querySelector('#tV').value;const f=c.querySelector('#tF').value;const t=c.querySelector('#tT').value;
      if(f==='C')v=v;else if(f==='F')v=(v-32)*5/9;else v=v-273.15;
      let r;if(t==='C')r=v;else if(t==='F')r=v*9/5+32;else r=v+273.15;
      c.querySelector('#tR').textContent=r.toFixed(4)};
  }
},

/* 5 */ {name:"Conversor de Divisas",desc:"USD, EUR, GBP, JPY, MXN (tasa fija)",icon:"fas fa-coins",
  init(c){
    const rates={USD:1,EUR:0.92,GBP:0.79,JPY:149.5,MXN:17.15,CAD:1.36,AUD:1.53,CHF:0.88,CNY:7.24,BRL:4.97};
    c.innerHTML=`<div class="row"><div><label>Cantidad</label><input id="cV" type="number" value="100"></div>
    <div><label>De</label><select id="cF">${Object.keys(rates).map(k=>`<option>${k}</option>`).join('')}</select></div>
    <div><label>A</label><select id="cT">${Object.keys(rates).map(k=>`<option ${k==='EUR'?'selected':''}>${k}</option>`).join('')}</select></div></div>
    <button class="btn" id="cB">Convertir</button><div class="result-box" id="cR"></div>`;
    c.querySelector('#cB').onclick=()=>{const v=+c.querySelector('#cV').value;
      const r=v/rates[c.querySelector('#cF').value]*rates[c.querySelector('#cT').value];
      c.querySelector('#cR').textContent=r.toFixed(2)};
  }
},

/* 6 */ {name:"Generador de Contraseñas",desc:"Contraseñas seguras personalizables",icon:"fas fa-key",
  init(c){
    c.innerHTML=`<label>Longitud: <strong id="pwLenVal">16</strong></label><input id="pwLen" type="range" min="4" max="64" value="16">
    <label><input type="checkbox" id="pwUp" checked> Mayúsculas</label>
    <label><input type="checkbox" id="pwNum" checked> Números</label>
    <label><input type="checkbox" id="pwSym" checked> Símbolos</label>
    <button class="btn" id="pwBtn">Generar</button><div class="result-box" id="pwRes" style="font-size:1.1rem;letter-spacing:1px"></div>`;
    c.querySelector('#pwLen').oninput=e=>c.querySelector('#pwLenVal').textContent=e.target.value;
    c.querySelector('#pwBtn').onclick=()=>{
      let chars='abcdefghijklmnopqrstuvwxyz';
      if(c.querySelector('#pwUp').checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if(c.querySelector('#pwNum').checked)chars+='0123456789';
      if(c.querySelector('#pwSym').checked)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
      const len=+c.querySelector('#pwLen').value;let pw='';
      const arr=new Uint32Array(len);crypto.getRandomValues(arr);
      for(let i=0;i<len;i++)pw+=chars[arr[i]%chars.length];
      c.querySelector('#pwRes').textContent=pw;
    };
  }
},

/* 7 */ {name:"Generador de Números Aleatorios",desc:"Genera números en un rango",icon:"fas fa-dice",
  init(c){
    c.innerHTML=`<div class="row"><div><label>Mínimo</label><input id="rnMin" type="number" value="1"></div>
    <div><label>Máximo</label><input id="rnMax" type="number" value="100"></div>
    <div><label>Cantidad</label><input id="rnCnt" type="number" value="1" min="1" max="50"></div></div>
    <button class="btn" id="rnBtn">Generar</button><div class="result-box" id="rnRes" style="font-size:1.2rem"></div>`;
    c.querySelector('#rnBtn').onclick=()=>{const mi=+c.querySelector('#rnMin').value;const ma=+c.querySelector('#rnMax').value;
      const n=Math.min(+c.querySelector('#rnCnt').value,50);const res=[];
      for(let i=0;i<n;i++)res.push(Math.floor(Math.random()*(ma-mi+1))+mi);
      c.querySelector('#rnRes').textContent=res.join(', ')};
  }
},

/* 8 */ {name:"Generador de QR",desc:"Crea códigos QR desde texto o URL",icon:"fas fa-qrcode",
  init(c){
    c.innerHTML=`<label>Texto o URL</label><input id="qrTxt" value="https://example.com">
    <button class="btn" id="qrBtn">Generar QR</button>
    <div style="text-align:center;margin-top:1rem"><img id="qrImg" style="max-width:200px;border-radius:8px"></div>`;
    c.querySelector('#qrBtn').onclick=()=>{const t=encodeURIComponent(c.querySelector('#qrTxt').value);
      c.querySelector('#qrImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${t}`};
  }
},

/* 9 */ {name:"Temporizador",desc:"Cuenta regresiva personalizable",icon:"fas fa-hourglass-start",
  init(c){
    c.innerHTML=`<div class="row"><div><label>Min</label><input id="tmM" type="number" value="5" min="0"></div>
    <div><label>Seg</label><input id="tmS" type="number" value="0" min="0" max="59"></div></div>
    <div style="text-align:center;margin:1rem 0"><span id="tmDisp" style="font-size:2.5rem;font-weight:700;font-family:monospace">05:00</span></div>
    <div class="row"><button class="btn" id="tmStart">Iniciar</button><button class="btn" id="tmStop" style="background:#555">Detener</button></div>`;
    let iv=null;
    c.querySelector('#tmStart').onclick=()=>{
      clearInterval(iv);let total=+c.querySelector('#tmM').value*60+ +c.querySelector('#tmS').value;
      const d=c.querySelector('#tmDisp');
      const show=()=>{const m=Math.floor(total/60);const s=total%60;d.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
      show();iv=setInterval(()=>{if(total<=0){clearInterval(iv);d.textContent='¡Tiempo!';return}total--;show()},1000)};
    c.querySelector('#tmStop').onclick=()=>clearInterval(iv);
  }
},

/* 10 */ {name:"Cronómetro",desc:"Cronómetro con vueltas",icon:"fas fa-stopwatch",
  init(c){
    c.innerHTML=`<div style="text-align:center"><span id="swDisp" style="font-size:2.5rem;font-weight:700;font-family:monospace">00:00.000</span></div>
    <div class="row" style="margin-top:1rem"><button class="btn" id="swStart">Iniciar</button><button class="btn" id="swLap" style="background:var(--accent2)">Vuelta</button><button class="btn" id="swReset" style="background:#555">Reset</button></div>
    <div id="swLaps" style="margin-top:.8rem;max-height:150px;overflow-y:auto;font-size:.85rem"></div>`;
    let t0=0,elapsed=0,iv=null,lap=1;
    const fmt=ms=>{const m=Math.floor(ms/60000);const s=Math.floor((ms%60000)/1000);const ml=ms%1000;
      return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(ml).padStart(3,'0')};
    const disp=c.querySelector('#swDisp');
    c.querySelector('#swStart').onclick=function(){
      if(iv){clearInterval(iv);iv=null;this.textContent='Continuar';return}
      t0=Date.now()-elapsed;this.textContent='Pausa';
      iv=setInterval(()=>{elapsed=Date.now()-t0;disp.textContent=fmt(elapsed)},31)};
    c.querySelector('#swLap').onclick=()=>{if(iv)c.querySelector('#swLaps').innerHTML+=`<div>Vuelta ${lap++}: ${fmt(elapsed)}</div>`};
    c.querySelector('#swReset').onclick=()=>{clearInterval(iv);iv=null;elapsed=0;lap=1;disp.textContent='00:00.000';
      c.querySelector('#swLaps').innerHTML='';c.querySelector('#swStart').textContent='Iniciar'};
  }
},

/* 11 */ {name:"Texto a Binario",desc:"Convierte texto a código binario",icon:"fas fa-code",
  init(c){
    c.innerHTML=`<label>Texto</label><textarea id="t2bIn" rows="2">Hola Mundo</textarea>
    <button class="btn" id="t2bBtn">Convertir</button><div class="result-box" id="t2bRes"></div>`;
    c.querySelector('#t2bBtn').onclick=()=>{
      c.querySelector('#t2bRes').textContent=[...c.querySelector('#t2bIn').value].map(ch=>ch.charCodeAt(0).toString(2).padStart(8,'0')).join(' ')};
  }
},

/* 12 */ {name:"Binario a Texto",desc:"Decodifica binario a texto legible",icon:"fas fa-file-code",
  init(c){
    c.innerHTML=`<label>Binario (separado por espacios)</label><textarea id="b2tIn" rows="2">01001000 01101111 01101100 01100001</textarea>
    <button class="btn" id="b2tBtn">Convertir</button><div class="result-box" id="b2tRes"></div>`;
    c.querySelector('#b2tBtn').onclick=()=>{
      c.querySelector('#b2tRes').textContent=c.querySelector('#b2tIn').value.trim().split(/\s+/).map(b=>String.fromCharCode(parseInt(b,2))).join('')};
  }
},

/* 13 */ {name:"Contador de Caracteres",desc:"Cuenta caracteres, palabras y líneas",icon:"fas fa-font",
  init(c){
    c.innerHTML=`<textarea id="ccIn" rows="4" placeholder="Escribe o pega texto aquí..."></textarea>
    <div class="result-box" id="ccRes">Caracteres: 0 | Palabras: 0 | Líneas: 0</div>`;
    c.querySelector('#ccIn').oninput=e=>{const t=e.target.value;
      const w=t.trim()?t.trim().split(/\s+/).length:0;
      const l=t?t.split('\n').length:0;
      c.querySelector('#ccRes').textContent=`Caracteres: ${t.length} | Palabras: ${w} | Líneas: ${l}`};
  }
},

/* 14 */ {name:"Color Aleatorio",desc:"Genera colores HEX, RGB y HSL aleatorios",icon:"fas fa-palette",
  init(c){
    c.innerHTML=`<div style="text-align:center"><div id="caBox" style="width:120px;height:120px;border-radius:16px;margin:0 auto 1rem;border:3px solid rgba(255,255,255,.1)"></div>
    <div class="result-box" id="caRes"></div></div><button class="btn" style="width:100%;margin-top:.5rem" id="caBtn">Nuevo Color</button>`;
    const gen=()=>{const h='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
      c.querySelector('#caBox').style.background=h;
      const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
      c.querySelector('#caRes').textContent=`HEX: ${h} | RGB: ${r},${g},${b}`};
    c.querySelector('#caBtn').onclick=gen;gen();
  }
},

/* 15 */ {name:"Mayúsculas / Minúsculas",desc:"Convierte texto a UPPER, lower, Title Case",icon:"fas fa-text-height",
  init(c){
    c.innerHTML=`<textarea id="csIn" rows="3" placeholder="Escribe texto...">hola mundo cruel</textarea>
    <div class="row"><button class="btn" data-t="up">MAYÚSCULAS</button><button class="btn" data-t="lo">minúsculas</button><button class="btn" data-t="ti">Title Case</button><button class="btn" data-t="se">oRaCiÓn</button></div>
    <div class="result-box" id="csRes"></div>`;
    c.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=c.querySelector('#csIn').value;
      const m=b.dataset.t;let r;
      if(m==='up')r=t.toUpperCase();
      else if(m==='lo')r=t.toLowerCase();
      else if(m==='ti')r=t.replace(/\b\w/g,l=>l.toUpperCase());

/* 26 */ {name:"Conversor de Color",desc:"HEX ↔ RGB ↔ HSL",icon:"fas fa-eye-dropper",
  init(c){
    c.innerHTML=`<label>Color HEX</label><input id="ccHex" value="#e94560">
    <button class="btn" id="ccBtn">Convertir</button><div class="result-box" id="ccRes"></div>
    <div id="ccPrev" style="height:50px;border-radius:8px;margin-top:.5rem"></div>`;
    c.querySelector('#ccBtn').onclick=()=>{let h=c.querySelector('#ccHex').value.replace('#','');
      if(h.length===3)h=h.split('').map(c=>c+c).join('');
      const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
      const max=Math.max(r,g,b)/255,min=Math.min(r,g,b)/255;
      const l=(max+min)/2;let s=0,hue=0;
      if(max!==min){s=l>.5?(max-min)/(2-max-min):(max-min)/(max+min);
        if(max===r/255)hue=((g/255-b/255)/(max-min))%6;
        else if(max===g/255)hue=(b/255-r/255)/(max-min)+2;
        else hue=(r/255-g/255)/(max-min)+4;
        hue=Math.round(hue*60);if(hue<0)hue+=360}
      c.querySelector('#ccRes').textContent=`RGB: ${r}, ${g}, ${b} | HSL: ${hue}°, ${Math.round(s*100)}%, ${Math.round(l*100)}%`;
      c.querySelector('#ccPrev').style.background=`#${h}`};
  }
},

/* 53 */ {name:"Pomodoro Timer",desc:"Técnica Pomodoro: 25 min trabajo, 5 min descanso",icon:"fas fa-tomato",
  init(c){
    c.innerHTML=`<div style="text-align:center"><div id="pomLabel" style="font-size:1rem;margin-bottom:.5rem">🍅 Trabajo</div>
    <div id="pomDisp" style="font-size:3rem;font-weight:700;font-family:monospace">25:00</div>
    <div class="row" style="margin-top:1rem;justify-content:center"><button class="btn" id="pomStart">Iniciar</button><button class="btn" id="pomReset" style="background:#555">Reset</button></div>
    <div id="pomCount" style="margin-top:.5rem;font-size:.85rem;color:var(--text-muted)">Pomodoros: 0</div></div>`;
    let iv=null,total=25*60,isWork=true,poms=0,running=false;
    const disp=c.querySelector('#pomDisp');const label=c.querySelector('#pomLabel');
    const show=()=>{const m=Math.floor(total/60);const s=total%60;disp.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
    c.querySelector('#pomStart').onclick=function(){
      if(running){clearInterval(iv);running=false;this.textContent='Continuar';return}
      running=true;this.textContent='Pausa';
      iv=setInterval(()=>{if(total<=0){clearInterval(iv);running=false;
        if(isWork){poms++;c.querySelector('#pomCount').textContent='Pomodoros: '+poms;total=5*60;isWork=false;label.textContent='☕ Descanso'}
        else{total=25*60;isWork=true;label.textContent='🍅 Trabajo'}
        show();c.querySelector('#pomStart').textContent='Iniciar';return}total--;show()},1000)};
    c.querySelector('#pomReset').onclick=()=>{clearInterval(iv);running=false;total=25*60;isWork=true;
      label.textContent='🍅 Trabajo';show();c.querySelector('#pomStart').textContent='Iniciar'};
  }
},

/* 61 */ {name:"Encriptar/Desencriptar César",desc:"Cifrado César con desplazamiento personalizable",icon:"fas fa-lock",
  init(c){
    c.innerHTML=`<textarea id="cesIn" rows="2">Hola Mundo</textarea>
    <label>Desplazamiento</label><input id="cesN" type="number" value="3" min="1" max="25">
    <div class="row"><button class="btn" id="cesE">Encriptar</button><button class="btn" id="cesD" style="background:var(--accent2)">Desencriptar</button></div>
    <div class="result-box" id="cesRes"></div>`;
    const shift=(t,n)=>[...t].map(ch=>{const c=ch.charCodeAt(0);
      if(c>=65&&c<=90)return String.fromCharCode((c-65+n)%26+65);
      if(c>=97&&c<=122)return String.fromCharCode((c-97+n)%26+97);return ch}).join('');
    c.querySelector('#cesE').onclick=()=>c.querySelector('#cesRes').textContent=shift(c.querySelector('#cesIn').value,+c.querySelector('#cesN').value);
    c.querySelector('#cesD').onclick=()=>c.querySelector('#cesRes').textContent=shift(c.querySelector('#cesIn').value,26- +c.querySelector('#cesN').value);
  }
},

/* 69 */ {name:"Conversor de Números a Letras",desc:"Escribe un número en palabras (español)",icon:"fas fa-spell-check",
  init(c){
    c.innerHTML=`<label>Número (0-999999)</label><input id="n2wN" type="number" value="12345">
    <button class="btn" id="n2wBtn">Convertir</button><div class="result-box" id="n2wRes"></div>`;
    const unidades=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
    const decenas=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
    const centenas=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
    const conv=(n)=>{if(n===0)return'cero';if(n===100)return'cien';let r='';
      if(n>=1000){const mil=Math.floor(n/1000);r+=(mil===1?'mil':conv(mil)+' mil')+' ';n%=1000}
      if(n>=100){r+=centenas[Math.floor(n/100)]+' ';n%=100}
      if(n<30)r+=unidades[n];
      else{r+=decenas[Math.floor(n/10)];if(n%10)r+=' y '+unidades[n%10]}
      return r.trim()};
    c.querySelector('#n2wBtn').onclick=()=>c.querySelector('#n2wRes').textContent=conv(+c.querySelector('#n2wN').value);
  }
},

/* 90 */ {name:"Mezclador de Colores",desc:"Mezcla dos colores y ve el resultado",icon:"fas fa-adjust",
  init(c){

    <div><label>Mezcla (%)</label><input id="mxP" type="range" min="0" max="100" value="50"></div></div>
    <div id="mxPrev" style="height:60px;border-radius:12px;margin:.8rem 0"></div>
    <div class="result-box" id="mxRes"></div>`;
    const upd=()=>{const c1=c.querySelector('#mx1').value;const c2=c.querySelector('#mx2').value;const p=c.querySelector('#mxP').value/100;
      const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);
      const r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);
      const r=Math.round(r1*(1-p)+r2*p),g=Math.round(g1*(1-p)+g2*p),b=Math.round(b1*(1-p)+b2*p);

/* 105 */ {name:"Calculadora de Promedio",desc:"Calcula media, mediana y moda",icon:"fas fa-calculator",
  init(c){
    c.innerHTML=`<label>Números (separados por comas)</label><input id="avgIn" value="5, 10, 15, 10, 20, 25, 10">
    <button class="btn" id="avgBtn">Calcular</button><div class="result-box" id="avgRes" style="white-space:pre-wrap"></div>`;
    c.querySelector('#avgBtn').onclick=()=>{const nums=c.querySelector('#avgIn').value.split(',').map(n=>parseFloat(n.trim())).filter(n=>!isNaN(n));
      if(!nums.length){c.querySelector('#avgRes').textContent='Sin datos';return}
      const mean=nums.reduce((a,b)=>a+b,0)/nums.length;
      const sorted=[...nums].sort((a,b)=>a-b);
      const median=sorted.length%2?sorted[Math.floor(sorted.length/2)]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
      const freq={};nums.forEach(n=>freq[n]=(freq[n]||0)+1);
      const maxFreq=Math.max(...Object.values(freq));
      const mode=Object.keys(freq).filter(k=>freq[k]===maxFreq).join(', ');
      c.querySelector('#avgRes').textContent=`Media: ${mean.toFixed(4)}\nMediana: ${median}\nModa: ${mode}\nMín: ${Math.min(...nums)} | Máx: ${Math.max(...nums)}\nSuma: ${nums.reduce((a,b)=>a+b,0)} | Cantidad: ${nums.length}`};
  }
},

  init(c){
    const common=[{p:21,s:'FTP'},{p:22,s:'SSH'},{p:25,s:'SMTP'},{p:53,s:'DNS'},{p:80,s:'HTTP'},{p:110,s:'POP3'},{p:143,s:'IMAP'},{p:443,s:'HTTPS'},{p:993,s:'IMAPS'},{p:3306,s:'MySQL'},{p:5432,s:'PostgreSQL'},{p:6379,s:'Redis'},{p:8080,s:'HTTP-Alt'},{p:8443,s:'HTTPS-Alt'},{p:27017,s:'MongoDB'}];
    c.innerHTML=`<p style="font-size:.85rem;color:var(--text-muted)">Simulación educativa de puertos comunes</p>
    <button class="btn" id="psBtn" style="width:100%">Escanear</button><div class="result-box" id="psRes" style="white-space:pre-wrap;font-size:.8rem;max-height:300px;overflow-y:auto">Haz clic para escanear</div>`;
    c.querySelector('#psBtn').onclick=()=>{
      c.querySelector('#psRes').textContent=common.map(({p,s})=>{
        const open=Math.random()>.6;return`Puerto ${String(p).padStart(5,' ')} (${s.padEnd(12,' ')}) — ${open?'🟢 ABIERTO':'🔴 CERRADO'}`}).join('\n')};
  }
},

];

/* ============================================================
   RENDER GRID
   ============================================================ */
const grid=document.getElementById('grid');
const totalCount=document.getElementById('totalCount');
const visibleCount=document.getElementById('visibleCount');
const noResults=document.getElementById('noResults');
const searchInput=document.getElementById('searchInput');

totalCount.textContent=tools.length;

function renderGrid(filter=''){
  grid.innerHTML='';
  const lower=filter.toLowerCase();
  let count=0;
  tools.forEach((tool,idx)=>{
    if(lower && !tool.name.toLowerCase().includes(lower) && !tool.desc.toLowerCase().includes(lower))return;
    count++;
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`<div class="icon"><i class="${tool.icon}"></i></div><h3>${tool.name}</h3><p>${tool.desc}</p>`;
    card.onclick=()=>openModal(tool);
    grid.appendChild(card);
  });
  visibleCount.textContent=count;
  noResults.style.display=count===0?'block':'none';
}

/* ============================================================
   MODAL LOGIC
   ============================================================ */
const overlay=document.getElementById('modalOverlay');
const modal=document.getElementById('modal');
const modalTitle=document.getElementById('modalTitle');
const modalBody=document.getElementById('modalBody');
const modalClose=document.getElementById('modalClose');

function openModal(tool){
  modalTitle.innerHTML=`<span class="icon"><i class="${tool.icon}"></i></span><span class="name">${tool.name}</span>`;
  modalBody.innerHTML='';
  tool.init(modalBody);
  overlay.classList.add('active');
  document.body.style.overflow='hidden';
}

function closeModal(){
  overlay.classList.remove('active');
  document.body.style.overflow='';
  // cleanup intervals if any
  if(modalBody._cleanup)modalBody._cleanup();
}

modalClose.onclick=closeModal;
overlay.onclick=e=>{if(e.target===overlay)closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ============================================================
   SEARCH
   ============================================================ */
searchInput.addEventListener('input',e=>renderGrid(e.target.value));

/* Initial render */
renderGrid();
</script>
</body>
</html>
